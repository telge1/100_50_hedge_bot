[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-generator-stoch-waves"
version = "0.1.0"
description = "Stochastic/Wave signal generator data foundation (ClickHouse)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "clickhouse-connect>=0.7.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "numpy>=1.26",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"signal_generator.strategy.wave_fade" = ["data/*.json", "FROZEN_BASELINE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires a reachable ClickHouse instance",
]
asyncio_mode = "auto"

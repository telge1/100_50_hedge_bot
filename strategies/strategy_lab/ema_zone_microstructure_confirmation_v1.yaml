metadata:
  description: >
    EMAs identify regime and decision zones. Per-level orderbook, public trades,
    open interest and liquidations classify the reaction. Trade execution and
    exit policy are intentionally deferred. EMA9/20/59 determine the short-term
    regime; EMA200 is a superior decision zone (not equal-weight regime input).
    Flat compression blocks candidates. Stacked EMA zones and next-zone clearance
    are research contracts only. No entry/exit/TP/SL invented.
  family: ema_zone_microstructure
  schema_version: strategy_spec/v2
  status: research
  strategy_id: ema_zone_microstructure_confirmation_v1
  strategy_version: 1.0.0
  title: EMA Zone Microstructure Confirmation V1
  variant: candidate_discovery_v1
provenance:
  catalog_contract_version:
    value: catalog/v2
  causality_status: causal_reusable_when_dependency_available
  git_commit: 3f2f18f7720b5bdd802543e80e3291dd9d3aaa0f
  plugin_refs:
  - contract_version:
      value: catalog/v2
    plugin_id:
      value: ema_zone_microstructure_confirmation
  source_paths:

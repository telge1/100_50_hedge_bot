# Optional systemd drop-in for dashboard.service (requires sudo to install):
#   sudo cp deploy/systemd/dashboard-ob1000-on-demand.conf \
#     /etc/systemd/system/dashboard.service.d/ob1000-on-demand.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart dashboard.service
#
# Not required when research_charts.ob1000_on_demand bootstraps from
# orderbook_analyse/.env (OB_V3_ON_DEMAND_*).
[Service]
Environment=OB_V3_ON_DEMAND_ENABLE=true
Environment=OB_V3_ON_DEMAND_SOCKET_PATH=/run/user/1000/orderbook_ob1000.sock
Environment=ORDERBOOK_ANALYSE_ROOT=/home/telgenbuescher/projects/orderbook_analyse

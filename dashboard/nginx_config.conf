# Nginx Reverse Proxy Configuration für Dashboard
# OPTION 1: Als separater Server auf Port 8081
# OPTION 2: Als location /hedgebot/ auf bestehender Port 80 Config

# OPTION 1: Separater Server (Port 8081)
server {
    listen 80;
    server_name dash.immotel.de 192.168.40.66;
    
    access_log /var/log/nginx/hedgebot-dashboard-access.log;
    error_log /var/log/nginx/hedgebot-dashboard-error.log;
    
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # zusätzlicher Alias für den neuen Hedge-Bot-Link
    location = /dashboard/50_100_hedgebot {
        return 301 /dashboard/50_100_hedgebot/;
    }
    location /dashboard/50_100_hedgebot/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}


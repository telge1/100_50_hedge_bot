<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Phase 11U-F historical remaining-pool heatmap</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1116; color: #d5dbe3; font: 14px/1.4 sans-serif; }
    header, #nav { display: flex; gap: 10px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
    button, select, input { background: #1c2430; color: #d5dbe3; border: 1px solid #3a4658; padding: 6px 8px; }
    button { cursor: pointer; }
    button[aria-pressed="true"] { border-color: #00e5ff; color: #fff; }
    label { display: inline-flex; gap: 6px; align-items: center; }
    #error { color: #f00032; min-height: 1.2em; margin: 0 12px; }
    #wrap { position: relative; height: calc(100% - 148px); }
    #chart { position: absolute; inset: 0; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    #meta { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <strong>DOGEUSDT 5m PD10</strong>
    <label>Close <select id="close-select"></select></label>
    <button id="prev" type="button">Zurück</button>
    <button id="next" type="button">Weiter</button>
    <input id="goto" type="text" size="24" placeholder="2026-09-30T12:05:00Z" />
    <button id="goto-btn" type="button">GO TO</button>
    <label><input id="layer-original" type="checkbox" checked /> Original ACTIVE</label>
    <label><input id="layer-remaining" type="checkbox" checked /> Remaining</label>
  </header>
  <div id="nav">
    <label>Full traversal <select id="case-select"></select></label>
    <button id="case-btn" type="button">Fall öffnen</button>
    <span id="meta"></span>
  </div>
  <p id="error"></p>
  <div id="wrap">
    <div id="chart"></div>
    <canvas id="overlay"></canvas>
  </div>
  <script src="./vendor/lightweight-charts.min.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>

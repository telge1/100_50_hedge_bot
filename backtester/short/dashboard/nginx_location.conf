# OPTION 2: Als location /hedgebot/ zur bestehenden dash.immotel.de Config hinzufügen
# Füge diesen Block zur bestehenden /etc/nginx/sites-available/dash.immotel.de hinzu:

    # Hedge Bot Dashboard
    location /hedgebot/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Wichtig: URL-Rewriting für statische Dateien
        rewrite ^/hedgebot/static/(.*)$ /static/$1 break;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


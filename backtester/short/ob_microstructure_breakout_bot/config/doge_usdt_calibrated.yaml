# DOGEUSDT thresholds from Phase A/B calibration (2026-09-21).
# Long and short are calibrated separately from labeled events.
#
# Long: near existing research YAML, tightened with strong/fake quantiles.
# Short: higher confirm bars + positive FT flip + delta-led (no ask-dominance required).
#
# Source events:
#   calibration/events/DOGEUSDT_strong_breakouts_phase_a.json
#   calibration/events/DOGEUSDT_fakeouts_phase_b.json

symbol: DOGEUSDT

context_lookback_minutes: 30
confirm_window_minutes: 5
followthrough_candles: 2

long:
  fakeout_max_confirm_delta: 40000.0
  tier1_min_confirm_delta: 160000.0
  tier2_min_confirm_delta: 350000.0
  tier1_min_ob_ratio_5bps: 1.05
  tier2_min_ob_ratio_5bps: 1.50
  fakeout_followthrough_flip_delta: -180000.0
  require_ob_support: true

short:
  fakeout_max_confirm_delta: 50000.0
  tier1_min_confirm_delta: 360000.0
  tier2_min_confirm_delta: 730000.0
  tier1_min_ob_ratio_5bps: 1.00
  tier2_min_ob_ratio_5bps: 1.20
  # Positive: FT delta >= this => short fakeout
  fakeout_followthrough_flip_delta: 170000.0
  # Strong short dumps often lack ask-dominant 5bps books.
  require_ob_support: false

# Hedge-Profile: Welche Account-Kombi pro Bot-Paar (HEDGE_PROFILE=main|bot_1|bot_2)
profiles:
  main:
    long_account: master
    short_account: sub
  bot_1:
    long_account: Long_bot_1
    short_account: Short_bot_1
  bot_2:
    long_account: Long_bot_2
    short_account: Short_bot_2
  bot_3:
    long_account: Long_bot_3
    short_account: Short_bot_3

# Long-TP Profit Prozent (BE + X%)
# Beispiel: 1.0 = BE + 1% Profit
long_tp_profit_percent: 1.0

# Optional: Logging-Level
# log_level: "INFO"

# Für Dashboard Restart/Stop von Long- und Short-Bot per systemctl (wird für beide verwendet)
system:
  sudo_password: "YOUR_SUDO_PASSWORD_OPTIONAL"




notifications:
  ntfy_topic: "price_alert"

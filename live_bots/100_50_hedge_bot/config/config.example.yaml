# Master-Config für Single-Account TP-Burn-Strategie
# Diese API-Keys werden von beiden Bots (Long + Short) verwendet

# API-Keys (NEU, ohne doppelte YAML-Keys)
# - master: Keys für Owner/Leader (Main-Account)
# - sub: Keys für Follower (Sub-Account)
#
# Empfehlung: Keys NICHT committen. Entweder hier lokal eintragen oder per ENV setzen:
# - BYBIT_MASTER_API_KEY / BYBIT_MASTER_SECRET_KEY
# - BYBIT_SUB_API_KEY / BYBIT_SUB_SECRET_KEY
master:
  api_key: "YOUR_BYBIT_API_KEY"
  secret_key: "YOUR_BYBIT_SECRET_KEY"
  uid: "33700306"

sub:
  api_key: "YOUR_BYBIT_API_KEY"
  secret_key: "YOUR_BYBIT_SECRET_KEY"


Long_bot_1:
